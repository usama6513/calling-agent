name: Security Scan (hourly)

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger security scan
        env:
          SCAN_URL: https://backend-seven-chi-71.vercel.app/api/security/scan
          SCAN_KEY: ${{ secrets.SCAN_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/scan-result.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-scan-key: $SCAN_KEY" \
            "$SCAN_URL")
          echo "HTTP status: $code"
          if [ "$code" != "201" ]; then
            echo "Scan failed to run"
            cat /tmp/scan-result.json
            exit 1
          fi
          echo "Scan completed successfully"
